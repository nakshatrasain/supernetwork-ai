<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding - SuperNetworkAI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="nav-logo">SuperNetworkAI</div>
      <div class="nav-links">
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>

    <div class="content">
      <h1>Complete Your Profile</h1>
      <p style="margin-bottom: 30px; color: #666;">Tell us about yourself to get better matches</p>

      <!-- Ikigai Section -->
      <div class="profile-section">
        <h3>Your Ikigai (Reason for Being)</h3>
        <div class="ikigai-grid">
          <div>
            <label>What you LOVE</label>
            <textarea id="ikigaiLove" rows="3" placeholder="What activities make you lose track of time?"></textarea>
          </div>
          <div>
            <label>What you're GOOD AT</label>
            <textarea id="ikigaiGoodAt" rows="3" placeholder="What skills come naturally to you?"></textarea>
          </div>
          <div>
            <label>What the WORLD NEEDS</label>
            <textarea id="ikigaiWorldNeeds" rows="3" placeholder="What problems do you want to solve?"></textarea>
          </div>
          <div>
            <label>What you can be PAID FOR</label>
            <textarea id="ikigaiPaidFor" rows="3" placeholder="What value can you provide?"></textarea>
          </div>
        </div>
      </div>

      <!-- CV Upload -->
      <div class="profile-section">
        <h3>Import from CV (Optional)</h3>
        <div class="form-group">
          <label>Upload CV/Resume</label>
          <input type="file" id="cvUpload" accept=".pdf,.txt,.doc,.docx" onchange="handleCVUpload(event)">
          <p id="uploadText" style="font-size: 0.9em; color: #666; margin-top: 5px;">
            Supports PDF, TXT, DOC files. AI will extract your skills automatically.
          </p>
        </div>
      </div>

      <!-- Basic Info -->
      <div class="profile-section">
        <h3>Basic Information</h3>
        <div class="form-group">
          <label>Primary Intent</label>
          <select id="intent">
            <option value="seeking_cofounder">Seeking Cofounder</option>
            <option value="seeking_client">Seeking Client</option>
            <option value="seeking_teammate">Seeking Teammate</option>
            <option value="offering_services">Offering Services</option>
          </select>
        </div>
        <div class="form-group">
          <label>Skills (comma-separated)</label>
          <input type="text" id="skills" placeholder="e.g., JavaScript, Marketing, AI, Design">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="location" placeholder="e.g., San Francisco, CA">
        </div>
        <div class="form-group">
          <label>Availability</label>
          <select id="availability">
            <option value="full_time">Full-time</option>
            <option value="part_time">Part-time</option>
            <option value="weekends">Weekends only</option>
            <option value="flexible">Flexible</option>
          </select>
        </div>
        <div class="form-group">
          <label>Working Style</label>
          <select id="workingStyle">
            <option value="remote">Remote</option>
            <option value="in_person">In-person</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>
      </div>

      <!-- Social Profiles -->
      <div class="profile-section">
        <h3>Portfolio & Social Profiles</h3>
        <div class="form-group">
          <label>Portfolio/Website</label>
          <input type="text" id="portfolioUrl" placeholder="https://yourportfolio.com">
        </div>
        <div class="form-group">
          <label>LinkedIn</label>
          <input type="text" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
        </div>
        <div class="form-group">
          <label>Twitter/X</label>
          <input type="text" id="twitter" placeholder="https://twitter.com/yourhandle">
        </div>
        <div class="form-group">
          <label>GitHub</label>
          <input type="text" id="github" placeholder="https://github.com/yourusername">
        </div>
      </div>

      <!-- Submit Button -->
      <button class="btn-primary" onclick="saveProfile()">Complete Profile & Start Matching</button>
      
      <p class="error-msg" id="errorMsg"></p>
      <p class="success-msg" id="successMsg"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
